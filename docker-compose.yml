# Simplified single-service deployment stack
#
# This docker-compose.yml uses the unified Dockerfile at repo root
# that builds both frontend and backend in a single container.
#
# Prerequisites:
# 1. Docker Desktop installed
# 2. Environment variables set (see .env.example in chat-app/)
#
# Usage:
#   cp chat-app/.env.example .env
#   # edit .env with your real values
#   docker compose up --build -d
#
# For cloud deployments (Railway, Render, Fly.io):
# Just set the environment variables in your platform dashboard
# and the Dockerfile handles everything automatically.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (min 32 chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CHAT_ENCRYPTION_KEY: ${CHAT_ENCRYPTION_KEY:-}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
